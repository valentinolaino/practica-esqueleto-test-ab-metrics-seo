<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 540"
  width="960"
  height="540"
  role="img"
  aria-labelledby="titulo desc"
  font-family="Georgia, 'Times New Roman', serif"
>
  <title id="titulo">Caso de prueba del experimento A/B</title>
  <desc id="desc">
    Gráfico de barras con la tasa de conversión del caso de prueba: variante A (control) 7,50% y
    variante B (tratamiento) 13,14%. La diferencia es 5,64 puntos porcentuales.
  </desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6" />
      <stop offset="1" stop-color="#ece4d5" />
    </linearGradient>
    <linearGradient id="barraA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9e86" />
      <stop offset="1" stop-color="#3f6b57" />
    </linearGradient>
    <linearGradient id="barraB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a35a" />
      <stop offset="1" stop-color="#b87830" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#fondo)" />

  <!-- Cabecera -->
  <text x="64" y="72" font-size="15" letter-spacing="3" fill="#7a6a55" font-family="monospace">
    TALLER NORTE · EXPERIMENTO A/B
  </text>
  <text x="64" y="122" font-size="38" fill="#2f2620">Caso de prueba fijo</text>
  <text x="64" y="158" font-size="18" fill="#6a5c4a">
    Tasa de conversión por variante · conversiones / impresiones
  </text>

  <!-- Eje / líneas guía -->
  <g stroke="#d8ccb8" stroke-width="1">
    <line x1="300" y1="200" x2="880" y2="200" />
    <line x1="300" y1="280" x2="880" y2="280" />
    <line x1="300" y1="360" x2="880" y2="360" />
    <line x1="300" y1="440" x2="880" y2="440" />
  </g>
  <g fill="#8a7b66" font-size="14" font-family="monospace" text-anchor="end">
    <text x="288" y="205">15,00%</text>
    <text x="288" y="285">10,00%</text>
    <text x="288" y="365">5,00%</text>
    <text x="288" y="445">0,00%</text>
  </g>

  <!-- Barra A: 7,50% sobre escala 0-15% -> 200..440 = 240px -> 7.5/15*240 = 120px -->
  <rect x="340" y="320" width="120" height="120" rx="6" fill="url(#barraA)" />
  <text x="400" y="305" font-size="30" fill="#2f2620" text-anchor="middle" font-family="monospace">7,50%</text>
  <text x="400" y="472" font-size="20" fill="#2f2620" text-anchor="middle">A · Control</text>
  <text x="400" y="500" font-size="15" fill="#7a6a55" text-anchor="middle" font-family="monospace">
    18 / 240
  </text>

  <!-- Barra B: 13,14% -> 13.14/15*240 = 210.24px -->
  <rect x="620" y="229.76" width="120" height="210.24" rx="6" fill="url(#barraB)" />
  <text x="680" y="215" font-size="30" fill="#2f2620" text-anchor="middle" font-family="monospace">13,14%</text>
  <text x="680" y="472" font-size="20" fill="#2f2620" text-anchor="middle">B · Tratamiento</text>
  <text x="680" y="500" font-size="15" fill="#7a6a55" text-anchor="middle" font-family="monospace">
    31 / 236
  </text>

  <!-- Flecha de diferencia -->
  <g stroke="#b87830" stroke-width="2.5" fill="none">
    <line x1="470" y1="318" x2="612" y2="228" />
  </g>
  <circle cx="612" cy="228" r="4" fill="#b87830" />
  <text x="548" y="250" font-size="17" fill="#8a5a1c" font-family="monospace">
    +5,64 pp
  </text>

  <!-- Pie -->
  <text x="64" y="516" font-size="14" fill="#8a7b66" font-family="monospace">
    Una tasa más alta no es una prueba: no se declara ganador.
  </text>
</svg>
